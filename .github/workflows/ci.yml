name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — build, unit, architecture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/backend/Lif.sln

      - name: Build
        run: dotnet build src/backend/Lif.sln --no-restore -warnaserror

      - name: Test (unit + architecture + integration)
        run: >
          dotnet test src/backend/Lif.sln --no-build --verbosity normal
          --logger "trx;LogFileName=results.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: '**/TestResults/**'

  frontend:
    name: Frontend — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install
        run: npm ci --no-fund --no-audit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  seeds:
    name: Seed validation — DAG, CEFR, references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # doc 18 §4: DAG acyclicity, CEFR consistency, error-code references,
      # unit/lesson coverage, exercise answer keys, lexicon resolution.
      - name: Validate de curriculum package
        run: dotnet run --project tools/lif-cli -- seed-validate seeds/curriculum/de

      - name: Validator self-check (fixture must fail)
        run: |
          if dotnet run --project tools/lif-cli -- seed-validate tools/lif-cli/testdata/invalid-package; then
            echo 'invalid fixture unexpectedly passed' && exit 1
          fi

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f deploy/Dockerfile -t lif:ci .
